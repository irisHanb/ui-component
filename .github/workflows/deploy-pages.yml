# main에 push하면 ui-kit-playground.html만 GitHub Pages에 배포한다.
# 저장소의 다른 파일(CLAUDE.md, my-prompts.md, docs/ 등)은 사이트에 올리지 않는다.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir _site
          cp ui-kit-playground.html _site/index.html
          cp ui-kit-playground.html _site/ui-kit-playground.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
