<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI Kit Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* 디자인 토큰: Polarize 10색 팔레트 기준
   (#D5001A #FF6A00 #FFB606 #FFD973 #FDF6DA #F2F7D8 #B0DDCD #41B4D6 #25539B #192275).
   폰트: 제목은 숫자·영문 컴포넌트명이 또렷한 Plus Jakarta Sans, 본문은 한국어 가독성을 위해 Noto Sans KR,
   코드는 글자 구분이 뚜렷한 JetBrains Mono.
   색: 무채색 글자 + 파랑 액센트 1색(#25539B, 흰 글자·흰 배경 위 대비 7.53). 페이지 바탕은 무채색 #F0F2F5.
   빨강·주황·호박·민트는 위험·경고·주의·성공 의미에만 쓴다. 메타 텍스트 #5F6E7E(바탕 위 4.66). */
:root{
  --bg:#FFFFFF; --bg-page:#F0F2F5; --bg-soft:#F6F7F9; --bg-code:#F6F7F9;
  --ink:#1E2D3D; --ink-2:#4A5C6E; --ink-3:#5F6E7E; --ink-4:#8A96A4;
  --line:#E2E6EC; --line-2:#CDD3DC;
  --accent:#25539B; --accent-hover:#192275; --accent-line:#25539B; --accent-soft:#E5EAF3; --accent-ink:#192275;
  --display:"Plus Jakarta Sans", "Noto Sans KR", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --sans:"Noto Sans KR", "Plus Jakarta Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{
  font-family:var(--sans); color:var(--ink); background:var(--bg);
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}

/* 레이아웃 */
.layout{display:grid; grid-template-columns:288px 1fr; height:100vh;}
.side{display:flex; flex-direction:column; min-height:0; overflow:hidden; border-right:1px solid var(--line); background:var(--bg);}
.main{overflow-y:auto; background:var(--bg-page);}

/* 사이드바: 브랜드 → 검색 → 분류 필터 → 번호순 목록 → 출처 (docs/resource/ui-elements-demo.html 구조) */
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
.brand{display:flex; align-items:center; gap:12px; padding:18px 18px 14px;}
.brand__mark{
  width:40px; height:40px; flex:none; display:grid; place-items:center;
  font-family:var(--mono); font-size:15px; font-weight:500; color:#fff; background:var(--ink); border-radius:6px;
}
.brand strong{display:block; font-family:var(--display); font-size:16px; font-weight:700; line-height:1.25;}
.brand div{min-width:0;}
.brand small{display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:var(--mono); font-size:11px; color:var(--ink-3);}
.find{position:relative; display:block; margin:0 18px;}
.find svg{position:absolute; left:10px; top:50%; margin-top:-8px; color:var(--ink-3); pointer-events:none;}
.find input{
  width:100%; padding:8px 10px 8px 34px; font:inherit; font-size:14px; color:var(--ink);
  background:var(--bg-soft); border:1px solid var(--line); border-radius:6px;
}
.find input:focus{outline:none; border-color:var(--accent-line); background:var(--bg);}
.cats{display:flex; flex-wrap:wrap; gap:4px; padding:12px 18px; border-bottom:1px solid var(--line);}
/* 분류 필터: label-chip-system의 chip-md(높이 24px · 11px · 600 · radius 5px) */
.cats button{
  display:inline-flex; align-items:center; gap:5px; height:24px; padding:0 9px;
  font-size:11px; font-weight:600; line-height:1; color:var(--ink-2); background:var(--bg);
  border:1px solid var(--line); border-radius:5px; cursor:pointer;
}
.cats button:hover{color:var(--ink); border-color:var(--line-2);}
.cats button[aria-pressed="true"]{color:var(--accent-ink); background:var(--accent-soft); border-color:var(--accent-line);}
.cats b{font-family:var(--mono); font-size:11px; font-weight:500; opacity:.75;}
.nav{flex:1; min-height:0; overflow:auto; margin:0; padding:6px 0 10px; list-style:none;}
.nav a{
  display:grid; grid-template-columns:24px minmax(0,1fr) 14px; align-items:center; gap:10px;
  padding:6px 18px 6px 15px; color:var(--ink); text-decoration:none; border-left:3px solid transparent;
}
.nav a:hover{background:var(--bg-soft);}
.nav a[aria-current="page"]{background:var(--accent-soft); border-left-color:var(--accent-line);}
.nav .num{font-family:var(--mono); font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums;}
.nav a[aria-current="page"] .num{color:var(--accent-ink); font-weight:500;}
.nav .nm{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px;}
.nav .nm b{font-weight:600;}
.nav .nm span{margin-left:6px; font-size:12px; color:var(--ink-3);}
.nav a[aria-current="page"] .nm span{color:var(--ink-2);}
.nav .cat{display:flex; color:var(--ink-4);}
.nav-empty{padding:16px 18px; font-size:13px; color:var(--ink-3);}
.side-foot{margin:0; padding:12px 18px 14px; border-top:1px solid var(--line); font-size:11.5px; line-height:1.5; color:var(--ink-3);}
.side-foot a{color:var(--ink-2); text-underline-offset:2px;}
.scrim{display:none;}

/* 메인 디테일 */
.detail{max-width:860px; margin:0 auto; padding:40px 44px 80px;}
.detail__head{margin-bottom:6px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
.detail__no{font-family:var(--mono); font-size:13px; color:var(--ink-3);}
.detail__title{font-family:var(--display); font-size:26px; font-weight:700; margin:0; letter-spacing:-0.02em;}
.detail__ko{font-size:15px; color:var(--ink-3);}
.badge{
  display:inline-flex; align-items:center; gap:5px; height:24px; padding:0 9px;
  font-size:11px; font-weight:600; line-height:1; border-radius:5px;
  color:var(--accent-ink); background:var(--accent-soft);
}
.detail__desc{color:var(--ink-2); margin:14px 0 16px; font-size:15px; max-width:680px;}
.meta{display:grid; grid-template-columns:max-content 1fr; gap:6px 16px; margin:0 0 26px; padding:14px 16px; font-size:14px; border:1px solid var(--line); border-radius:8px; background:var(--bg);}
.meta dt{color:var(--ink-3); font-weight:500;}
.meta dd{margin:0; color:var(--ink);}

/* 탭 */
.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:0;}
.tab{
  padding:10px 16px; font-size:13px; font-weight:500; color:var(--ink-2);
  background:0; border:0; border-bottom:2px solid transparent; cursor:pointer; margin-bottom:-1px;
}
.tab:hover{color:var(--ink);}
.tab.is-active{color:var(--accent-ink); border-bottom-color:var(--accent-line);}

.panel{border:1px solid var(--line); border-top:0; border-radius:0 0 8px 8px; overflow:hidden; background:var(--bg);}
.panel[hidden]{display:none;}

/* 미리보기 */
/* 미리보기 영역: contain:layout으로 position:fixed 컴포넌트(토스트·배너·모달 배경)가 이 영역 안에만 붙는다 */
.panel[data-tab="preview"]{overflow:visible;}
.stage{
  position:relative; contain:layout; display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:380px; padding:28px; color:var(--ink); background:var(--bg); border-radius:0 0 8px 8px;
}
.stage :is(input,select,textarea){font-family:inherit;}
/* showModal()을 미리보기 안에서 흉내 낸 dialog와 배경. :where()로 명시도 0이라 컴포넌트 CSS가 항상 우선한다 */
.stage-backdrop{position:absolute; inset:0; z-index:1000; background:rgba(30, 45, 61, .4); border-radius:0 0 8px 8px;}
:where(.stage dialog[data-preview-modal]){position:absolute; inset:0; z-index:1001; max-width:calc(100% - 2em - 6px); max-height:calc(100% - 2em - 6px); overflow:auto;}

/* 코드 */
.code-wrap{position:relative; background:var(--bg-code);}
.code-copy{
  display:inline-flex; align-items:center; gap:5px;
  position:absolute; top:10px; right:10px; z-index:2;
  font-size:11px; padding:5px 10px; color:var(--ink-2); background:var(--bg);
  border:1px solid var(--line-2); border-radius:5px; cursor:pointer;
}
.code-copy:hover{background:#fff; color:var(--ink);}
pre{margin:0; padding:48px 20px 18px; overflow:auto; max-height:420px;}
code{font-family:var(--mono); font-size:13px; line-height:1.7; color:#1E2D3D; white-space:pre; tab-size:2;}
.code-empty{padding:24px 20px; color:var(--ink-3); font-size:14px;}
/* 구문 하이라이트: 토큰 종류를 구분하는 의미 색만 쓴다 */
.tk-c{color:#5F6E7E; font-style:italic;}
.tk-t,.tk-k{color:#192275;}
.tk-a{color:#AB4700;}
.tk-s{color:#33775F;}
.tk-n{color:#8A6200;}
.tk-f{color:#1E2D3D; font-weight:500;}

/* 모바일 토글 */
.menu-toggle{display:none;}
@media (max-width:880px){
  .layout{grid-template-columns:1fr;}
  .side{position:fixed; z-index:30; top:0; left:0; width:280px; height:100%; transform:translateX(-100%); transition:transform 150ms;}
  .side.is-open{transform:translateX(0);}
  .scrim.show{display:block; position:fixed; inset:0; z-index:25; background:rgba(30, 45, 61, .35);}
  .menu-toggle{
    display:inline-flex; align-items:center; gap:8px; position:fixed; z-index:21; top:14px; left:14px;
    padding:8px 14px; font-size:13px; background:var(--bg); border:1px solid var(--line-2);
    border-radius:6px; cursor:pointer;
  }
  .detail{padding:64px 22px 60px;}
}
</style>
<style id="stage-css"></style>
</head>
<body>
<button class="menu-toggle" id="menuToggle"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg> 목록</button>
<div class="scrim" id="scrim"></div>
<div class="layout">
  <aside class="side" id="side" aria-label="컴포넌트 목록">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">UI</span>
      <div>
        <strong>UI Kit Playground</strong>
        <small>46 COMPONENTS · HTML/CSS/JS</small>
      </div>
    </div>

    <label class="find">
      <span class="sr">컴포넌트 이름 찾기</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="find" type="search" placeholder="이름으로 찾기 (예: 메뉴)" autocomplete="off">
    </label>

    <div class="cats" id="cats" role="group" aria-label="분류로 거르기"></div>

    <ol class="nav" id="navList"></ol>

    <p class="side-foot">
      32개 요소와 4가지 분류:
      <a href="https://careerfoundry.com/en/blog/ui-design/ui-element-glossary/" target="_blank" rel="noopener">CareerFoundry · 32 UI Elements</a>.
      공통 레이어 12종과 화면 패턴 2종은 이 사이트에서 추가했습니다.
    </p>
  </aside>
  <main class="main">
    <div class="detail" id="detail"></div>
  </main>
</div>

<script>
// 컴포넌트 데이터 — 정본: docs/resource/ui-components-32-catalog.html (32종) + 공통 레이어 12종
// 필드: { id, num, name, nameKo, cat, desc, usecase, feature, html, css, js }
const components = [
  {
    id: "accordion", num: 1, name: "Accordion", nameKo: "아코디언", cat: "container",

    usecase: "FAQ · 상품 상세 설명 · 설정 메뉴",
    feature: "콘텐츠 토글 / 단계적 정보 노출 (Progressive Disclosure)",
    html: `<div class="accordion">
  <div class="accordion-item">

      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>

      <span class="accordion-chip accordion-chip--mint">배송</span>
      <span class="accordion-title">배송은 얼마나 걸리나요?</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>

    <button class="accordion-header" aria-expanded="false">

      <span class="accordion-title">환불 정책이 궁금합니다</span>

  </div>
</div>`,
    css: `/* 너비 고정: 펼친 본문 길이와 무관하게 같은 폭 */
.accordion {
  width: 100%; max-width: 360px; overflow: hidden;
  background: #fff; border: 1px solid #E2E6EC; border-radius: 8px;
}
.accordion-item + .accordion-item { border-top: 1px solid #E2E6EC; }
.accordion-header {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 12px 14px; font-size: 13px; font-weight: 600; color: #1E2D3D; text-align: left;
  background: #fff; border: 0; cursor: pointer; font-family: inherit;
  transition: background-color .15s;
}
.accordion-header:hover { background: #F6F7F9; }
.accordion-header:focus-visible { outline: 2px solid #25539B; outline-offset: -2px; }
.accordion-title { flex: 1; }
.accordion-header svg { flex-shrink: 0; color: #5F6E7E; }
.accordion-item.open .accordion-header { color: #192275; background: #E5EAF3; }
.accordion-item.open .accordion-header svg { color: #192275; transform: rotate(180deg); }
.accordion-body { display: none; padding: 12px 14px 14px; font-size: 13px; line-height: 1.6; color: #4A5C6E; }
.accordion-item.open .accordion-body { display: block; }

/* 카테고리 칩: label-chip-system chip-sm + COLOR.json 프리셋 */
.accordion-chip {
  display: inline-flex; align-items: center; flex-shrink: 0;
  height: 20px; padding: 0 7px; border-radius: 4px;
  font-size: 10px; font-weight: 600; line-height: 1; white-space: nowrap;
}
.accordion-chip--blue { color: #FFFFFF; background: #25539B; }
.accordion-chip--mint { color: #1E2D3D; background: #B0DDCD; }
.accordion-chip--orange { color: #1E2D3D; background: #FF6A00; }`,
    js: `document.querySelectorAll('.accordion-header').forEach(btn => {
  btn.addEventListener('click', () => {
    const open = btn.parentElement.classList.toggle('open');
    btn.setAttribute('aria-expanded', String(open));
  });
});`
  },
  {
    id: "bento", num: 2, name: "Bento Menu", nameKo: "벤토 메뉴", cat: "nav",

    usecase: "Google 앱 런처 · MS 365 앱 스위처",
    feature: "그리드 형태의 앱·기능 진입점 제공",
    html: `<div class="bento-wrap">
  <button class="bento-trigger" aria-label="앱 메뉴 열기" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="1"/><circle cx="19" cy="5" r="1"/><circle cx="5" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="12" cy="19" r="1"/><circle cx="19" cy="19" r="1"/><circle cx="5" cy="19" r="1"/></svg></button>
  <div class="bento-popover">

    <a class="bapp" href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg><span>캘린더</span></a>
    <a class="bapp" href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" x2="2" y1="12" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" x2="6.01" y1="16" y2="16"/><line x1="10" x2="10.01" y1="16" y2="16"/></svg><span>드라이브</span></a>
    <a class="bapp" href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg><span>문서</span></a>
    <a class="bapp" href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg><span>채팅</span></a>
    <a class="bapp" href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/></svg><span>지도</span></a>
  </div>
</div>`,
    css: `.bento-wrap { position: relative; display: inline-block; }
.bento-trigger {
  background: #fff; border: 1px solid #E2E6EC; border-radius: 6px;
  width: 36px; height: 36px; padding: 0; color: #1E2D3D; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.bento-popover {
  display: none; position: absolute; background: #fff;
  border: 1px solid #E2E6EC; border-radius: 8px; padding: 8px;
  box-shadow: 0 1px 2px rgba(0,0,0,.06);
  grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; z-index: 10;
}
.bento-wrap.open .bento-popover { display: grid; }
.bento-popover .bapp {
  width: 64px; padding: 10px 4px; border-radius: 6px; color: #1E2D3D; text-decoration: none;
  display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px;
}
.bento-popover .bapp svg { color: #4A5C6E; }
.bento-popover .bapp:hover { background: #F6F7F9; }
.bento-popover .bapp:focus-visible { outline: 2px solid #25539B; outline-offset: -2px; }
.bento-trigger:hover { background: #F6F7F9; }
.bento-wrap.open .bento-trigger { color: #192275; background: #E5EAF3; border-color: #25539B; }
.bento-trigger:focus-visible { outline: 2px solid #25539B; outline-offset: -2px; }`,
    js: `document.querySelectorAll('.bento-trigger').forEach(btn => {
  btn.addEventListener('click', e => {
    e.stopPropagation();
    const open = btn.parentElement.classList.toggle('open');
    btn.setAttribute('aria-expanded', String(open));
  });
});
document.addEventListener('click', () => {
  document.querySelectorAll('.bento-wrap.open').forEach(w => {
    w.classList.remove('open');
    w.querySelector('.bento-trigger').setAttribute('aria-expanded', 'false');
  });
});`

    css: `.carousel { width: 100%; max-width: 320px; position: relative; }
.carousel-track { display: flex; overflow: hidden; border-radius: 8px; background: #EEF1F4; }
.carousel-slide {
  min-width: 100%; height: 100px;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; font-weight: 700; color: #fff;
  transition: margin-left .15s ease;
}
.carousel-slide.s1 { background: #1E2D3D; }
.carousel-slide.s2 { background: #4A5C6E; }
.carousel-slide.s3 { background: #5F6E7E; }
.carousel-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
.carousel-btn {
  background: #fff; border: 1px solid #E2E6EC; color: #1E2D3D;
  width: 28px; height: 28px; border-radius: 6px; padding: 0; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.carousel-dots { display: flex; gap: 6px; }
.carousel-dot { width: 8px; height: 8px; border-radius: 50%; background: #CDD3DC; cursor: pointer; }
.carousel-dot.active { background: #25539B; }`,
    js: `(function() {
  const car = document.getElementById('carousel-demo');
  if (!car) return;
  const slides = car.querySelectorAll('.carousel-slide');
  const dots = car.querySelectorAll('.carousel-dot');
  let idx = 0;
  function go(i) {
    idx = (i + slides.length) % slides.length;
    slides[0].style.marginLeft = (-idx * 100) + '%';
    dots.forEach((d, j) => d.classList.toggle('active', j === idx));
  }
  car.querySelector('.prev').addEventListener('click', () => go(idx - 1));
  car.querySelector('.next').addEventListener('click', () => go(idx + 1));
  dots.forEach(d => d.addEventListener('click', () => go(+d.dataset.i)));
})();`

    js: `(function() {
  document.querySelectorAll('.dropdown').forEach(dd => {
    const trigger = dd.querySelector('.dropdown-trigger');
    const value = dd.querySelector('.dd-value');
    trigger.addEventListener('click', e => {
      e.stopPropagation();
      document.querySelectorAll('.dropdown.open').forEach(d => d !== dd && d.classList.remove('open'));
      trigger.setAttribute('aria-expanded', String(dd.classList.toggle('open')));
    });
    dd.querySelectorAll('.dropdown-item').forEach(item => {
      item.addEventListener('click', () => {
        if (value) value.textContent = item.textContent;
        dd.querySelectorAll('.dropdown-item').forEach(x => x.setAttribute('aria-selected', String(x === item)));
        dd.classList.remove('open');
        trigger.setAttribute('aria-expanded', 'false');
      });
    });
  });
  document.addEventListener('click', () => {
    document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));

})();`

    js: `(function() {
  const pg = document.getElementById('pg-demo');
  if (!pg) return;
  const total = 5;
  let cur = 1;
  function set(n) {
    cur = Math.max(1, Math.min(total, n));
    pg.querySelectorAll('.pg-btn[data-i]').forEach(b => {
      b.classList.toggle('active', +b.dataset.i === cur);
      if (+b.dataset.i === cur) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    pg.querySelector('[data-act="prev"]').disabled = cur === 1;
    pg.querySelector('[data-act="next"]').disabled = cur === total;
  }
  pg.addEventListener('click', e => {
    const b = e.target.closest('.pg-btn');
    if (!b) return;
    if (b.dataset.act === 'prev') set(cur - 1);
    else if (b.dataset.act === 'next') set(cur + 1);
    else if (b.dataset.i) set(+b.dataset.i);
  });
  set(1);
})();`

    css: `.picker-wrap { position: relative; }

.picker-wrap.open .picker-calendar { display: block; }
.picker-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.picker-header button {
  background: transparent; border: none;
  display: flex; cursor: pointer; color: #5F6E7E; padding: 4px;
}
.picker-header .month { font-size: 13px; font-weight: 700; }
.picker-grid { display: grid; grid-template-columns: repeat(7, 28px); gap: 2px; }
.picker-grid .pday-head {
  font-size: 10px; font-weight: 600;
  color: #5F6E7E; text-align: center; padding: 4px 0;
}
.picker-grid .pday {
  width: 28px; height: 28px; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; cursor: pointer;
}
.picker-grid .pday:hover { background: #EEF1F4; }
.picker-grid .pday.selected { background: #25539B; color: #fff; font-weight: 700; }
.picker-grid .pday.empty { visibility: hidden; }`,
    js: `(function() {
  const wrap = document.getElementById('picker-demo');
  if (!wrap) return;
  const input = wrap.querySelector('.picker-input');
  const grid = wrap.querySelector('.picker-grid');
  const monthEl = wrap.querySelector('.month');
  const today = new Date();
  let view = new Date(today.getFullYear(), today.getMonth(), 1);
  let selected = null;
  function render() {
    monthEl.textContent = view.getFullYear() + '년 ' + (view.getMonth() + 1) + '월';
    grid.innerHTML = '';
    ['일','월','화','수','목','금','토'].forEach(d => {
      const h = document.createElement('div');
      h.className = 'pday-head'; h.textContent = d;
      grid.appendChild(h);
    });
    const firstDay = view.getDay();
    const daysInMonth = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
    for (let i = 0; i < firstDay; i++) {
      const e = document.createElement('div');
      e.className = 'pday empty'; grid.appendChild(e);
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const day = document.createElement('div');
      day.className = 'pday'; day.textContent = d;
      if (selected && selected.getFullYear() === view.getFullYear() &&
          selected.getMonth() === view.getMonth() && selected.getDate() === d) {
        day.classList.add('selected');
      }
      day.addEventListener('click', () => {
        selected = new Date(view.getFullYear(), view.getMonth(), d);
        input.value = selected.toISOString().slice(0, 10);
        wrap.classList.remove('open');
        render();
      });
      grid.appendChild(day);
    }
  }
  input.addEventListener('click', e => {
    e.stopPropagation();
    wrap.classList.toggle('open');
  });
  wrap.querySelector('[data-act="prev"]').addEventListener('click', e => {
    e.stopPropagation();
    view.setMonth(view.getMonth() - 1); render();
  });
  wrap.querySelector('[data-act="next"]').addEventListener('click', e => {
    e.stopPropagation();
    view.setMonth(view.getMonth() + 1); render();
  });
  document.addEventListener('click', e => {
    if (!wrap.contains(e.target)) wrap.classList.remove('open');
  });
  render();
})();`

    css: `.stepper {
  display: flex; align-items: center;
  border: 1px solid #E2E6EC; border-radius: 6px;
  overflow: hidden; width: fit-content; background: #fff;
}
.stepper button {
  background: #fff; border: none;
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  padding: 0; color: #1E2D3D; cursor: pointer;
}
.stepper button:hover:not(:disabled) { background: #EEF1F4; }
.stepper button:disabled { color: #CDD3DC; cursor: not-allowed; }
.stepper .stepper-value {
  min-width: 40px; text-align: center;
  font-size: 13px; font-weight: 600;
  border-left: 1px solid #E2E6EC; border-right: 1px solid #E2E6EC;
  padding: 6px 8px;
}`,
    js: `(function() {
  const st = document.getElementById('stepper-demo');
  if (!st) return;
  const val = st.querySelector('.stepper-value');
  const minus = st.querySelector('[data-act="-"]');
  const plus = st.querySelector('[data-act="+"]');
  const MIN = 1, MAX = 99;
  function update() {
    const n = +val.textContent;
    minus.disabled = n <= MIN;
    plus.disabled = n >= MAX;
  }
  minus.addEventListener('click', () => {
    const n = +val.textContent;
    if (n > MIN) { val.textContent = n - 1; update(); }
  });
  plus.addEventListener('click', () => {
    const n = +val.textContent;
    if (n < MAX) { val.textContent = n + 1; update(); }
  });
  update();
})();`

    css: `.chip-demo { display: flex; flex-direction: column; gap: 6px; max-width: 360px; }

.chip-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* 라벨 칩: 색은 --chip-bg / --chip-fg 두 값으로만 바꾼다 */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  height: 24px; padding: 0 9px; border-radius: 5px;
  font-size: 11px; font-weight: 600; line-height: 1; white-space: nowrap;
  color: var(--chip-fg, #1E2D3D); background: var(--chip-bg, #EEF1F4);
}
.chip--sm { height: 20px; padding: 0 7px; gap: 4px; font-size: 10px; border-radius: 4px; }
.chip--lg { height: 28px; padding: 0 11px; font-size: 12px; border-radius: 6px; }
.chip__dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .7; flex-shrink: 0; }
.chip__rm {
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  width: 14px; height: 14px; padding: 0; color: inherit;
  background: rgba(0, 0, 0, .18); border: 0; border-radius: 4px; cursor: pointer;
  transition: background-color .12s;
}
.chip__rm:hover { background: rgba(0, 0, 0, .38); }

/* Polarize 10색 (배경 / 글자: 흰색과 #1E2D3D 중 대비가 높은 쪽, 모두 4.5:1 이상) */

.chip--orange { --chip-bg: #FF6A00; --chip-fg: #1E2D3D; }
.chip--amber { --chip-bg: #FFB606; --chip-fg: #1E2D3D; }
.chip--yellow { --chip-bg: #FFD973; --chip-fg: #1E2D3D; }
.chip--cream { --chip-bg: #FDF6DA; --chip-fg: #1E2D3D; }
.chip--lime { --chip-bg: #F2F7D8; --chip-fg: #1E2D3D; }
.chip--mint { --chip-bg: #B0DDCD; --chip-fg: #1E2D3D; }
.chip--sky { --chip-bg: #41B4D6; --chip-fg: #1E2D3D; }
.chip--blue { --chip-bg: #25539B; --chip-fg: #FFFFFF; }
.chip--navy { --chip-bg: #192275; --chip-fg: #FFFFFF; }
/* 흰 패널 위에서 경계가 보이지 않는 밝은 칩은 테두리로 구분 */

/* 우선순위 배지 */
.pbadge {

    js: `var bell = document.querySelector('.ntf__bell');
var panel = document.querySelector('.ntf__panel');
var count = document.querySelector('.ntf__count');

function updateCount() {
  var n = panel.querySelectorAll('.is-unread').length;
  count.textContent = n ? String(n) : '';
  bell.setAttribute('aria-label', n ? '알림 ' + n + '개 읽지 않음' : '알림');
}
function setOpen(open) {
  panel.hidden = !open;
  bell.setAttribute('aria-expanded', String(open));
}

bell.addEventListener('click', function () { setOpen(panel.hidden); });
panel.querySelectorAll('.ntf__item').forEach(function (item) {
  item.addEventListener('click', function () {
    item.classList.remove('is-unread');
    updateCount();
  });
});
document.querySelector('.ntf__readall').addEventListener('click', function () {
  panel.querySelectorAll('.is-unread').forEach(function (item) { item.classList.remove('is-unread'); });
  updateCount();
});
document.addEventListener('click', function (e) {
  if (!e.target.closest('.ntf')) setOpen(false);
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') setOpen(false);
});
updateCount();`

function toast(message, type, duration) {
  var el = document.createElement('div');
  el.className = 'tst tst--' + (type || 'info');
  el.setAttribute('role', type === 'error' ? 'alert' : 'status');
  el.innerHTML = TOAST_ICONS[type] || TOAST_ICONS.info;

  var text = document.createElement('span');
  text.textContent = message;
  var close = document.createElement('button');
  close.type = 'button';
  close.className = 'tst__close';
  close.setAttribute('aria-label', '닫기');
  close.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>';
  close.addEventListener('click', function () { el.remove(); });

  el.append(text, close);
  stack.appendChild(el);
  if (stack.children.length > 3) stack.firstElementChild.remove();
  setTimeout(function () { el.remove(); }, duration || 3000);
}

document.querySelectorAll('.tst-demo button').forEach(function (btn) {
  btn.addEventListener('click', function () {
    toast(MESSAGES[btn.dataset.type], btn.dataset.type);

function snackbar(text, onUndo) {
  clearTimeout(snkTimer);
  snkMsg.textContent = text;
  snkUndo = onUndo || null;
  snkAction.hidden = !onUndo;
  snk.hidden = false;
  snkTimer = setTimeout(function () { snk.hidden = true; }, 4000);

  snk.hidden = true;
});

    var index = Array.prototype.indexOf.call(list.children, li);

    snackbar(li.querySelector('span').textContent + ' 삭제됨', function () {

    });
  });

var bshResult = bshWrap.querySelector('.bsh__result');

  bshWrap.classList.add('is-open');
  bshSheet.inert = false;

  bshSheet.querySelector('button').focus({ preventScroll: true });
}

function closeSheet(value) {
  bshWrap.classList.remove('is-open');
  bshSheet.inert = true;
  bshPage.inert = false;
  bshOpen.setAttribute('aria-expanded', 'false');
  bshOpen.focus({ preventScroll: true });
  bshResult.textContent = value ? '공유 방법: ' + value : '';
}

bshOpen.addEventListener('click', openSheet);
bshWrap.querySelector('.bsh__backdrop').addEventListener('click', function () { closeSheet(''); });
bshSheet.querySelectorAll('[data-value]').forEach(function (btn) {
  btn.addEventListener('click', function () { closeSheet(btn.dataset.value); });
});
bshWrap.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && bshWrap.classList.contains('is-open')) closeSheet('');
});`

    js: `var popovers = document.querySelectorAll('.ppv');

function closePopovers(except) {
  popovers.forEach(function (p) {
    if (p === except) return;
    p.querySelector('.ppv__panel').hidden = true;
    p.querySelector('.ppv__trigger').setAttribute('aria-expanded', 'false');
  });
}

popovers.forEach(function (p) {
  var trigger = p.querySelector('.ppv__trigger');
  var box = p.querySelector('.ppv__panel');
  trigger.addEventListener('click', function () {
    closePopovers(p);
    box.hidden = !box.hidden;
    trigger.setAttribute('aria-expanded', String(!box.hidden));
  });
});

document.addEventListener('click', function (e) {
  if (!e.target.closest('.ppv')) closePopovers();
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') closePopovers();
});`

    css: `/* 너비 고정: 오류 문구가 나타나도 폭이 바뀌지 않음 */

/* 소셜 버튼: 색·로고는 각 사 로그인 버튼 가이드라인 값(액센트 1색 규칙의 예외) */

.slg__btn--google { color: #1F1F1F; background: #fff; border-color: #747775; }

.slg__btn:hover { filter: brightness(.96); }

.slg__divider { display: flex; align-items: center; gap: 10px; margin: 20px 0 16px; font-size: 12px; color: #5F6E7E; }
.slg__divider::before, .slg__divider::after { content: ""; flex: 1; height: 1px; background: #E2E6EC; }

}

.slg__input:hover { border-color: #CDD3DC; }
.slg__input:focus { outline: none; border-color: #25539B; }
.slg__input[aria-invalid="true"] { border-color: #D5001A; }
.slg__error { min-height: 16px; margin: 4px 0 8px; font-size: 12px; color: #D5001A; }

}

.slg__eye .i-hide, .slg__eye[aria-pressed="true"] .i-show { display: none; }

}
.slg__submit:hover { background: #192275; }
.slg__submit:disabled { cursor: progress; opacity: .7; }

.slg__submit[aria-busy="true"] .slg__spin { display: block; }
@keyframes slg-spin { to { transform: rotate(360deg); } }

    js: `var slg = document.querySelector('.slg');
var slgForm = slg.querySelector('.slg__form');
var slgStatus = slg.querySelector('.slg__status');
var slgSubmit = slg.querySelector('.slg__submit');

// 소셜 로그인: 실제 서비스에서는 서버가 만든 인가 URL로 이동한다(client_id·redirect_uri·state는 서버에서 발급).
// 예) location.href = '/auth/kakao';  →  서버가 https://kauth.kakao.com/oauth/authorize?... 로 리다이렉트
slg.querySelectorAll('.slg__btn').forEach(function (btn) {
  btn.addEventListener('click', function () {
    slgStatus.textContent = btn.dataset.provider + ' 인증 페이지로 이동합니다.';
  });
});

// 비밀번호 보기 / 숨기기
slg.querySelectorAll('.slg__eye').forEach(function (eye) {
  eye.addEventListener('click', function () {
    var input = document.getElementById(eye.getAttribute('aria-controls'));
    var show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    eye.setAttribute('aria-pressed', String(show));
    eye.setAttribute('aria-label', show ? '비밀번호 숨기기' : '비밀번호 보기');
  });
});

function setError(input, msg) {
  input.setAttribute('aria-invalid', msg ? 'true' : 'false');
  document.getElementById(input.getAttribute('aria-describedby')).textContent = msg;
}

slgForm.addEventListener('input', function (e) { if (e.target.matches('.slg__input')) setError(e.target, ''); });

slgForm.addEventListener('submit', function (e) {
  e.preventDefault();
  var email = slgForm.email, pw = slgForm.password;
  setError(email, /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email.value.trim()) ? '' : '올바른 이메일 주소를 입력하세요.');
  setError(pw, pw.value ? '' : '비밀번호를 입력하세요.');
  var invalid = slgForm.querySelector('[aria-invalid="true"]');
  if (invalid) { invalid.focus(); return; }

  // 데모: 서버 요청 대신 1초 지연. 입력값은 어디로도 보내지 않는다.
  slgSubmit.disabled = true;
  slgSubmit.setAttribute('aria-busy', 'true');
  slgStatus.textContent = '';
  setTimeout(function () {
    slgSubmit.disabled = false;
    slgSubmit.removeAttribute('aria-busy');
    slgStatus.textContent = '로그인했습니다.';
  }, 1000);
});`

    css: `/* 너비 고정: 오류·강도 문구가 바뀌어도 폭이 바뀌지 않음 */

  var doc = new Proxy(document, {
    get: function(target, key){
      if(key === "querySelector") return function(sel){ return stage.querySelector(sel); };
      if(key === "querySelectorAll") return function(sel){ return stage.querySelectorAll(sel); };
      if(key === "getElementById") return function(id){ return stage.querySelector("#" + CSS.escape(id)); };
      if(key === "addEventListener") return function(type, fn, opt){
        document.addEventListener(type, fn, opt);
        cleanups.push(function(){ document.removeEventListener(type, fn, opt); });
      };
      var v = Reflect.get(target, key);
      return typeof v === "function" ? v.bind(target) : v;
    }
  });
  function tracked(set, clear){
    return function(){
      var id = set.apply(window, arguments);
      cleanups.push(function(){ clear(id); });
      return id;
    };
  }
  try {
    new Function("document", "setTimeout", "setInterval", e.js)(
      doc, tracked(setTimeout, clearTimeout), tracked(setInterval, clearInterval));
  } catch(err){ console.error("[preview] " + e.id, err); }
}

var LANGS = { html: "HTML", css: "CSS", js: "JavaScript" };

function codeBlock(e, lang){
  var source = (e[lang] || "").trim();
  if(!source){
    return '<div class="panel" data-tab="' + lang + '" hidden>' +
           '<div class="code-empty">이 컴포넌트는 ' + LANGS[lang] + ' 코드가 필요 없습니다.</div></div>';
  }
  return '<div class="panel" data-tab="' + lang + '" hidden>' +
         '<div class="code-wrap"><button class="code-copy" type="button" data-src="' + lang + '">' + icon("copy", 13) + '복사</button>' +
         '<pre><code>' + highlight(source, lang) + '</code></pre></div></div>';
}

function copyCode(btn, text){
  var codeEl = btn.parentElement.querySelector("code");
  function done(html){
    btn.innerHTML = html;
    clearTimeout(btn._t);
    btn._t = setTimeout(function(){ btn.innerHTML = icon("copy", 13) + "복사"; }, 1200);
  }
  function fallback(){
    var r = document.createRange();
    r.selectNodeContents(codeEl);
    var s = window.getSelection();
    s.removeAllRanges(); s.addRange(r);
    done("선택됨 · Ctrl+C");
  }
  try {
    navigator.clipboard.writeText(text).then(function(){ done(icon("check", 13) + "복사됨"); }, fallback);
  } catch(err){ fallback(); }
}

function select(id){
  var e = components.find(function(x){ return x.id === id; });
  if(!e) return;

  // 사이드바 활성화
  current = id;
  navList.querySelectorAll("a").forEach(function(a){
    if(a.getAttribute("href") === "#" + id) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });

  detail.innerHTML =
    '<div class="detail__head">' +
      '<span class="detail__no">' + pad(e.num) + '</span>' +
      '<h2 class="detail__title">' + e.name + '</h2>' +
      '<span class="detail__ko">' + e.nameKo + '</span>' +
      '<span class="badge">' + icon(CATS[e.cat].icon, 13) + CATS[e.cat].label + '</span>' +
    '</div>' +
    '<p class="detail__desc">' + e.desc + '</p>' +
    '<dl class="meta">' +
      '<dt>사용 사례</dt><dd>' + escapeHtml(e.usecase) + '</dd>' +
      '<dt>핵심 기능</dt><dd>' + escapeHtml(e.feature) + '</dd>' +
    '</dl>' +
    '<div class="tabs" role="tablist">' +
      '<button class="tab is-active" role="tab" aria-selected="true" data-tab="preview">미리보기</button>' +
      '<button class="tab" role="tab" aria-selected="false" data-tab="html">HTML</button>' +
      '<button class="tab" role="tab" aria-selected="false" data-tab="css">CSS</button>' +
      '<button class="tab" role="tab" aria-selected="false" data-tab="js">JS</button>' +
    '</div>' +
    '<div class="panel" data-tab="preview"><div class="stage" role="region" aria-label="' + e.name + ' 미리보기"></div></div>' +
    codeBlock(e, "html") +
    codeBlock(e, "css") +
    codeBlock(e, "js");

  runPreview(detail.querySelector(".stage"), e);

  // 탭 전환
  detail.querySelectorAll(".tab").forEach(function(t){
    t.addEventListener("click", function(){
      var key = t.dataset.tab;
      detail.querySelectorAll(".tab").forEach(function(x){
        x.classList.toggle("is-active", x===t);
        x.setAttribute("aria-selected", String(x===t));
      });
      detail.querySelectorAll(".panel").forEach(function(p){ p.hidden = p.dataset.tab !== key; });
    });
  });

  // 복사 버튼
  detail.querySelectorAll(".code-copy").forEach(function(btn){
    btn.addEventListener("click", function(){ copyCode(btn, e[btn.dataset.src].trim()); });
  });

  history.replaceState(null, "", "#" + id);
  detail.parentElement.scrollTop = 0;
}

function closeSide(){
  side.classList.remove("is-open");
  scrim.classList.remove("show");
}
document.getElementById("menuToggle").addEventListener("click", function(){
  scrim.classList.toggle("show", side.classList.toggle("is-open"));
});
scrim.addEventListener("click", closeSide);

// 최초 선택: #id가 있으면 그 컴포넌트
renderNav();
var start = location.hash.slice(1);
select(components.some(function(x){ return x.id === start; }) ? start : components[0].id);
</script>
</body>
